name: CD - Build & Push Docker Images

on:
  push:
    branches: [ main ]

jobs:
  check-major:
    name: Check for [MAJOR] tag
    runs-on: ubuntu-latest
    outputs:
      is_major: ${{ steps.check.outputs.is_major }}
    steps:
      - name: Check commit message for [MAJOR]
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if echo "$COMMIT_MSG" | grep -qi '\[MAJOR\]'; then
            echo "is_major=true" >> $GITHUB_OUTPUT
            echo "✅ [MAJOR] tag detected - CD pipeline will run"
          else
            echo "is_major=false" >> $GITHUB_OUTPUT
            echo "⏭️ No [MAJOR] tag - skipping CD pipeline"
          fi

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: check-major
    if: needs.check-major.outputs.is_major == 'true'

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE_TAG=$(date +'%Y%m%d')
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "date_tag=$DATE_TAG" >> $GITHUB_OUTPUT
          echo "version=$DATE_TAG-$SHORT_SHA" >> $GITHUB_OUTPUT

      # ======== Backend API ========
      - name: Build & Push Backend API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ======== Fish Recognition Service ========
      - name: Build & Push Fish Recognition Service
        uses: docker/build-push-action@v6
        with:
          context: ./fish-recognition-service
          file: ./fish-recognition-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/fish-recognition:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/fish-recognition:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ======== Frontend ========
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ======== Summary ========
      - name: Print image summary
        run: |
          echo "## 🐳 Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend API | \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend\` | \`latest\`, \`${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Fish Recognition | \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/fish-recognition\` | \`latest\`, \`${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend\` | \`latest\`, \`${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
