# =============================================
# WhereWeFishin - Docker Compose
# =============================================
# Usage:
#   docker-compose up -d          (start all services)
#   docker-compose down           (stop all services)
#   docker-compose up --build     (rebuild and start)

services:

  # ==== SQL Server Database ====
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wherewefishin-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:-YourStr0ngP@ssw0rd!}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ==== .NET Backend API ====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wherewefishin-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=WhereWeFishinDb;User Id=sa;Password=${SQL_SA_PASSWORD:-YourStr0ngP@ssw0rd!};TrustServerCertificate=true;MultipleActiveResultSets=true;Connect Timeout=60
      - Jwt__Key=${JWT_KEY:-YourSuperSecretKeyThatShouldBeAtLeast32CharactersLongForHS256Algorithm}
      - Jwt__Issuer=WhereWeFishinAPI
      - Jwt__Audience=WhereWeFishinClient
      - Jwt__ExpirationHours=24
      - FishRecognitionService__Url=http://fish-recognition:5001
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL:-}
      - Smtp__FromName=${SMTP_FROM_NAME:-WhereWeFishin}
      - Smtp__UseDefaultCredentials=${SMTP_USE_DEFAULT_CREDENTIALS:-false}
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  # ==== Python Fish Recognition Service ====
  # Requires NVIDIA Container Toolkit on the host:
  #   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
  fish-recognition:
    build:
      context: ./fish-recognition-service
      dockerfile: Dockerfile
    container_name: wherewefishin-fish-recognition
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,video,display,gpu
    ports:
      - "5001:5001"
    volumes:
      - fish-uploads:/app/uploads
      - fish-outputs:/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ==== Angular Frontend (nginx) ====
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: wherewefishin-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlserver-data:
  backend-uploads:
  fish-uploads:
  fish-outputs:
