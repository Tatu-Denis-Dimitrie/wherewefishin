# =============================================
# WhereWeFishin – Full nginx configuration
# Replaces /etc/nginx/nginx.conf
# =============================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Real client IP from Cloudflare Tunnel ───────────────
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # ── Docker DNS (resolve container names) ──────────────────
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # ── Upstream pools ────────────────────────────────────────
    upstream backend_pool {
        server backend:8080 max_fails=0;
        keepalive 32;
        keepalive_requests 10000;
        keepalive_timeout 240s;
    }

    upstream fish_pool {
        server fish-recognition:5001 max_fails=0;
        keepalive 16;
        keepalive_requests 10000;
        keepalive_timeout 240s;
    }

    # ── Rate / connection limit zones (http context) ──────────
    limit_req_zone  $binary_remote_addr zone=api_rate:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth_rate:10m  rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
    proxy_set_header Connection "";

    # ── Server ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ── Keepalive: Cloudflare-compatible values ───────────
        keepalive_timeout  120s;
        keepalive_requests 10000;
        send_timeout       120s;
        client_body_timeout  60s;
        client_header_timeout 60s;

        # ── Connection limit per IP ───────────────────────────
        limit_conn addr_conn 50;
        limit_conn_status 429;
        limit_req_status  429;

        # ── gzip (including proxied responses) ────────────────
        gzip on;
        gzip_static on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/manifest+json;
        gzip_min_length 256;
        gzip_comp_level 5;
        gzip_proxied any;
        gzip_vary on;

        # ── ETag for conditional requests (304 Not Modified) ──
        etag on;

        # ── Proxy buffering defaults ──────────────────────────
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;

        # ── Intercept upstream errors → show custom error page ─
        proxy_intercept_errors off;

        # ── Cache static assets in memory ─────────────────────
        open_file_cache max=2000 inactive=60s;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;

        # ── HSTS (applies to all locations that don't override add_header) ─
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ── Health endpoint (Docker + cloudflared) ────────────
        location = /health {
            access_log off;
            return 200 'OK';
        }

        # ── robots.txt – serve as plain text, no SPA fallback ─
        location = /robots.txt {
            add_header Content-Type "text/plain";
            add_header Cache-Control "public, max-age=86400";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }

        # ── Angular SPA ──────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── index.html: short cache + full security headers ──
        location = /index.html {
            add_header Cache-Control                 "public, max-age=300, must-revalidate";
            add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options        "nosniff" always;
            add_header X-Frame-Options               "SAMEORIGIN" always;
            add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
            add_header Cross-Origin-Opener-Policy    "same-origin" always;
            add_header Permissions-Policy            "camera=(), microphone=(), geolocation=(self)" always;
            add_header Content-Security-Policy       "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.stripe.com; frame-src https://js.stripe.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
        }

        # ── Service Worker: must always be fresh ────────────
        location = /ngsw-worker.js {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }

        location = /ngsw.json {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }

        location = /manifest.webmanifest {
            add_header Cache-Control "public, max-age=86400, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }

        # ── API proxy → backend pool (keepalive) ─────────────
        location /api/ {
            limit_req zone=api_rate burst=20 nodelay;

            proxy_pass http://backend_pool;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_request_buffering on;

            client_max_body_size  150M;
            proxy_connect_timeout 30s;
            proxy_read_timeout    300s;
            proxy_send_timeout    60s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # ── Auth endpoints – stricter rate limit ─────────────
        location /api/auth/ {
            limit_req zone=auth_rate burst=5 nodelay;

            proxy_pass http://backend_pool;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            
            proxy_request_buffering on;

            client_max_body_size  1M;
            proxy_connect_timeout 15s;
            proxy_read_timeout    30s;
            proxy_send_timeout    15s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # ── Uploads proxy → backend pool (keepalive) ─────────
        location /uploads/ {
            proxy_pass http://backend_pool;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;


            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    30s;

            proxy_next_upstream error timeout http_502;
        }

        # ── Swagger proxy → backend pool (keepalive) ─────────
        location /swagger/ {
            proxy_pass http://backend_pool;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            

            proxy_connect_timeout 10s;
        }

        # ── Video outputs proxy → fish-recognition pool ──────
        location /outputs/ {
            proxy_pass http://fish_pool;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range             $http_range;
            proxy_set_header If-Range          $http_if_range;


            proxy_connect_timeout 10s;
            proxy_read_timeout    300s;
        }

        # ── Cache static assets ──────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            gzip_static on;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }
    }
}
