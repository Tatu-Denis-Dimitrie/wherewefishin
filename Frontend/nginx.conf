server {
    listen 80;
    server_name localhost wherewefishin.uk www.wherewefishin.uk;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS resolver (re-resolve on upstream changes)
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Angular SPA - redirect all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy processed video outputs from fish-recognition service
    location /outputs/ {
        set $fish_recognition_upstream http://fish-recognition:5001;
        proxy_pass $fish_recognition_upstream/outputs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503;
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    }

    # Proxy API requests to backend
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 150M;
        proxy_read_timeout 1200s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    # Proxy uploads static files to backend
    location /uploads/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Proxy Swagger
    location /swagger/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
