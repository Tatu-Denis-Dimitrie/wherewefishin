# ── Docker DNS (resolve container names at request time, not startup) ──
resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Keepalive: ține conexiunile deschise pentru cloudflared ──
    keepalive_timeout 620s;
    keepalive_requests 10000;
    send_timeout 600s;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ── gzip ───────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # ── Health endpoint (Docker + cloudflared) ─────────────
    location = /health {
        access_log off;
        return 200 'OK';
    }

    # ── Angular SPA ────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy → backend:8080 ───────────────────────────
    location /api/ {
        set $api http://backend:8080;
        proxy_pass $api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        client_max_body_size 150M;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    60s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 10s;
    }

    # ── Uploads proxy → backend:8080 ──────────────────────
    location /uploads/ {
        set $api http://backend:8080;
        proxy_pass $api;

        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
    }

    # ── Swagger proxy → backend:8080 ──────────────────────
    location /swagger/ {
        set $api http://backend:8080;
        proxy_pass $api;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
    }

    # ── Video outputs proxy → fish-recognition:5001 ───────
    location /outputs/ {
        set $fish http://fish-recognition:5001;
        proxy_pass $fish;

        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Range     $http_range;
        proxy_set_header If-Range  $http_if_range;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
    }

    # ── Cache static assets ───────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
