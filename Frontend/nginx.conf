# ── Docker DNS (resolve container names at request time, not startup) ──
resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 5s;

# ── Upstream with keepalive (reuse connections to backend) ──
upstream backend_pool {
    server backend:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

upstream fish_pool {
    server fish-recognition:5001 max_fails=3 fail_timeout=30s;
    keepalive 8;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Keepalive: ține conexiunile deschise pentru cloudflared ──
    keepalive_timeout 620s;
    keepalive_requests 10000;
    send_timeout 600s;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ── gzip (incluzând răspunsuri proxy) ──────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;

    # ── Proxy buffering defaults ──────────────────────────────
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;

    # ── Cache static assets in memory ─────────────────────────
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ── Health endpoint (Docker + cloudflared) ─────────────────
    location = /health {
        access_log off;
        return 200 'OK';
    }

    # ── Custom error pages for gateway errors ──────────────────
    error_page 502 503 504 /gateway_error.json;
    location = /gateway_error.json {
        internal;
        default_type application/json;
        return 502 '{"error":"Service temporarily unavailable. Please retry in a few seconds.","status":502}';
    }

    # ── Angular SPA ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy → backend pool (keepalive) ───────────────────
    location /api/ {
        proxy_pass http://backend_pool;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        client_max_body_size 150M;
        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    60s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 10s;
    }

    # ── Uploads proxy → backend pool (keepalive) ──────────────
    location /uploads/ {
        proxy_pass http://backend_pool;

        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
    }

    # ── Swagger proxy → backend pool (keepalive) ──────────────
    location /swagger/ {
        proxy_pass http://backend_pool;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
    }

    # ── Video outputs proxy → fish-recognition pool ───────────
    location /outputs/ {
        proxy_pass http://fish_pool;

        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_set_header Range     $http_range;
        proxy_set_header If-Range  $http_if_range;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
    }

    # ── Cache static assets ───────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
