<div class="auth-card">
        <h1>Create account</h1>
        <p class="auth-subtitle">Register to get started</p>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
          <div class="field-row">
            <div class="field">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" formControlName="firstName" placeholder="First name" />
            </div>
            <div class="field">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" formControlName="lastName" placeholder="Last name" />
            </div>
          </div>

          <div class="field">
            <label for="username">Username *</label>
            <input
              type="text" id="username" formControlName="username"
              placeholder="Choose a username"
              [class.has-error]="username?.invalid && username?.touched"
            />
            <div class="field-error" *ngIf="username?.invalid && username?.touched">
              <span *ngIf="username?.errors?.['required']">Username is required</span>
              <span *ngIf="username?.errors?.['minlength']">At least 3 characters</span>
            </div>
          </div>

          <div class="field">
            <label for="email">Email *</label>
            <input
              type="email" id="email" formControlName="email"
              placeholder="your@email.com"
              [class.has-error]="email?.invalid && email?.touched"
            />
            <div class="field-error" *ngIf="email?.invalid && email?.touched">
              <span *ngIf="email?.errors?.['required']">Email is required</span>
              <span *ngIf="email?.errors?.['email']">Invalid email</span>
            </div>
          </div>

          <div class="field">
            <label for="password">Password *</label>
            <input
              type="password" id="password" formControlName="password"
              placeholder="Choose a password"
              [class.has-error]="password?.invalid && password?.touched"
            />
            <div class="field-error" *ngIf="password?.invalid && password?.touched">
              <span *ngIf="password?.errors?.['required']">Password is required</span>
              <span *ngIf="password?.errors?.['minlength']">At least 6 characters</span>
            </div>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm Password *</label>
            <input
              type="password" id="confirmPassword" formControlName="confirmPassword"
              placeholder="Confirm your password"
              [class.has-error]="confirmPassword?.invalid && confirmPassword?.touched"
            />
            <div class="field-error" *ngIf="confirmPassword?.invalid && confirmPassword?.touched">
              <span *ngIf="confirmPassword?.errors?.['required']">Confirmation required</span>
            </div>
          </div>

          <div class="field-error server-error" *ngIf="errorMessage">
            {{ errorMessage }}
          </div>

          <button type="submit" class="btn-primary" [disabled]="registerForm.invalid || isLoading">
            <span *ngIf="!isLoading">Create Account</span>
            <span *ngIf="isLoading" class="loading-text"><span class="dot-loader"></span> Creating...</span>
          </button>

          <div class="auth-footer">
            <p>Already have an account? <a routerLink="/login">Sign in</a></p>
          </div>
        </form>
</div>
