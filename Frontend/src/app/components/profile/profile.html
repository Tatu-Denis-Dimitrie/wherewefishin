<div class="page-shell">
  <!-- Page header -->
  <header class="page-header">
    <h1>Profile</h1>
  </header>

  <!-- Toasts -->
  <div class="toast toast-error" *ngIf="error">{{ error }}</div>
  <div class="toast toast-success" *ngIf="successMessage">{{ successMessage }}</div>

  <!-- Profile card -->
  <div class="profile-card" *ngIf="user">
    <!-- Avatar + identity -->
    <div class="profile-header">
      <div class="avatar-ring">
        <img *ngIf="user.profilePictureUrl" [src]="user.profilePictureUrl" class="avatar-img" alt="Avatar" />
        <span *ngIf="!user.profilePictureUrl" class="avatar-initials">{{ getInitials() }}</span>
      </div>
      <div class="identity">
        <h2>{{ getDisplayName() }}</h2>
        <span class="handle">&#64;{{ user.username }}</span>
        <span class="role-badge" [ngClass]="{
          'badge-admin': user.role === 'Admin',
          'badge-manager': user.role === 'Manager',
          'badge-user': user.role === 'User'
        }">{{ user.role }}</span>
      </div>
    </div>

    <!-- Detail grid (view mode) -->
    <div class="detail-grid" *ngIf="!isEditing">
      <div class="detail-item">
        <span class="detail-label">Email</span>
        <span class="detail-value">{{ user.email }}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">First Name</span>
        <span class="detail-value">{{ user.firstName || '—' }}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Last Name</span>
        <span class="detail-value">{{ user.lastName || '—' }}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Member Since</span>
        <span class="detail-value">{{ formatDate(user.createdAt) }}</span>
      </div>
    </div>

    <!-- Edit form -->
    <div class="edit-form" *ngIf="isEditing">
      <div class="field">
        <label>First Name</label>
        <input type="text" [(ngModel)]="editForm.firstName" placeholder="First name" />
      </div>
      <div class="field">
        <label>Last Name</label>
        <input type="text" [(ngModel)]="editForm.lastName" placeholder="Last name" />
      </div>
      <div class="field">
        <label>Profile Picture URL</label>
        <input type="text" [(ngModel)]="editForm.profilePictureUrl" placeholder="https://..." />
      </div>
    </div>

    <!-- Action buttons -->
    <div class="profile-actions">
      <button class="btn-outline" (click)="toggleEdit()">
        {{ isEditing ? 'Cancel' : 'Edit Profile' }}
      </button>
      <button class="btn-primary" *ngIf="isEditing" (click)="saveProfile()" [disabled]="loading">
        {{ loading ? 'Saving…' : 'Save Changes' }}
      </button>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading-spinner" *ngIf="loading && !user">
    <div class="spinner"></div>
  </div>
</div>
