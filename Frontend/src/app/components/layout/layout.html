<div class="app-shell">
  <!-- Mobile top bar -->
  <header class="mobile-topbar">
    <button class="hamburger-btn" (click)="toggleMobileMenu()" aria-label="Open menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="mobile-brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 512 512" fill="currentColor" stroke="currentColor" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="32" stroke-linejoin="round" d="M240,152c-50.71,12.21-94.15,52.31-120.3,73.43a261.14,261.14,0,0,0-23.81-19.58C59.53,179.29,16,176,16,176s11.37,51.53,41.36,79.83C27.37,284.14,16,335.67,16,335.67s43.53-3.29,79.89-29.85a259.18,259.18,0,0,0,23.61-19.41C145.6,307.55,189.24,347.75,240,360l-16,56c39.43-6.67,78.86-35.51,94.72-48.25C448,362,496,279,496,256c0-22-48-106-176.89-111.73C303.52,131.78,263.76,102.72,224,96Z"></path>
          <circle cx="416" cy="239.99" r="16"></circle>
          <path fill="none" stroke="currentColor" stroke-width="32" stroke-linecap="round" stroke-miterlimit="20" d="M378.37,356a199.22,199.22,0,0,1,0-200"></path>
        </svg>
      </div>
      <span>WhereWeFishin</span>
    </div>
    <a class="mobile-cart-btn" routerLink="/cart">
      <div class="cart-icon-wrapper">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        @if (cartService.count() > 0) {
          <span class="cart-badge">{{ cartService.count() }}</span>
        }
      </div>
    </a>
  </header>

  <!-- Backdrop overlay for mobile drawer -->
  <div class="mobile-backdrop" [class.open]="mobileMenuOpen" (click)="closeMobileMenu()"></div>

  <!-- Sidebar Navigation -->
  <aside class="sidebar" [class.mobile-open]="mobileMenuOpen">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 512 512" fill="currentColor" stroke="currentColor" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="32" stroke-linejoin="round" d="M240,152c-50.71,12.21-94.15,52.31-120.3,73.43a261.14,261.14,0,0,0-23.81-19.58C59.53,179.29,16,176,16,176s11.37,51.53,41.36,79.83C27.37,284.14,16,335.67,16,335.67s43.53-3.29,79.89-29.85a259.18,259.18,0,0,0,23.61-19.41C145.6,307.55,189.24,347.75,240,360l-16,56c39.43-6.67,78.86-35.51,94.72-48.25C448,362,496,279,496,256c0-22-48-106-176.89-111.73C303.52,131.78,263.76,102.72,224,96Z"></path>
          <circle cx="416" cy="239.99" r="16"></circle>
          <path fill="none" stroke="currentColor" stroke-width="32" stroke-linecap="round" stroke-miterlimit="20" d="M378.37,356a199.22,199.22,0,0,1,0-200"></path>
        </svg>
      </div>
      <span class="brand-name">WhereWeFishin</span>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span>Map</span>
      </a>
      <a class="nav-item" routerLink="/fish-recognition" routerLinkActive="active" (click)="closeMobileMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        <span>Fish Recognition</span>
      </a>
      <a class="nav-item" routerLink="/profile" routerLinkActive="active" (click)="closeMobileMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Profile</span>
      </a>
      @if (isAdmin) {
        <a class="nav-item" routerLink="/admin" routerLinkActive="active" (click)="closeMobileMenu()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Admin</span>
        </a>
      }
      <a class="nav-item cart-nav-item" routerLink="/cart" routerLinkActive="active" (click)="closeMobileMenu()">
        <div class="cart-icon-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          @if (cartService.count() > 0) {
            <span class="cart-badge">{{ cartService.count() }}</span>
          }
        </div>
        <span>Cart</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a class="nav-item" routerLink="/faq" routerLinkActive="active" (click)="closeMobileMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span>FAQ</span>
      </a>

      <button (click)="logout()" class="logout-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Log out</span>
      </button>
    </div>
  </aside>

  <!-- Page content -->
  <main class="main-content">
    <div class="main-fireflies" aria-hidden="true">
      <span class="main-firefly mf-1"></span>
      <span class="main-firefly mf-2"></span>
      <span class="main-firefly mf-3"></span>
      <span class="main-firefly mf-4"></span>
      <span class="main-firefly mf-5"></span>
      <span class="main-firefly mf-6"></span>
      <span class="main-firefly mf-7"></span>
      <span class="main-firefly mf-8"></span>
    </div>

    <section class="page-content">
      <router-outlet />
    </section>
    <app-site-footer></app-site-footer>
  </main>
</div>
