<div class="home-container">
  <header>
    <h1>Where We Fishin'</h1>
    <div class="user-info">
      <button (click)="goToFishRecognition()" class="fish-recognition-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke-width="2"/>
        </svg>
        Fish Recognition
      </button>
      <button (click)="goToProfile()" class="profile-btn">Profile</button>
      <button (click)="logout()" class="logout-btn">Logout</button>
    </div>
  </header>
  
  @if (showSaveMessage) {
    <div class="save-message">
      ✓ Shapes saved successfully!
    </div>
  }
  
  <main>
    <div class="map-section">
      <div class="map-header">
        <h2>Fishing Spots Map</h2>
        <p>Use the tools on the right side of the map to add pontoons and fishing areas</p>
      </div>
      <div id="map" class="map-container"></div>
      <button (click)="saveShapesManually()" class="save-btn-floating">
        Save
      </button>
      <button (click)="toggleDeleteMode()" class="delete-btn-floating" [class.active]="isDeleteMode">
        {{ isDeleteMode ? 'Cancel' : 'Delete' }}
      </button>
    </div>
  </main>
</div>
