<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WhereWeFishin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Discover the best fishing spots with WhereWeFishin! Providing AI-powered fish detection and location services to help you find the perfect fishing locations.">
  <meta name="theme-color" content="#141e0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <!-- Google Fonts – preconnect both endpoints, preload critical woff2 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://fonts.gstatic.com/s/dmsans/v17/rP2Hp2ywxg089UriCZOIHQ.woff2">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap">
  <!-- Inline critical CSS: splash screen while Angular bootstraps -->
  <style>
    .sp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;background:#141e0f;z-index:9999;font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
    .sp::before{content:'';position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(125,179,74,.13) 0%,transparent 68%);top:-160px;right:-150px;pointer-events:none;animation:_ob 14s ease-in-out infinite alternate}
    .sp::after{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(74,144,164,.09) 0%,transparent 66%);bottom:-120px;left:10%;pointer-events:none;animation:_oc 17s ease-in-out infinite}
    .sp-logo{position:relative;width:76px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,#7ab349 0%,#5e9730 100%);box-shadow:0 8px 30px rgba(125,179,74,.32),inset 0 1px 0 rgba(255,255,255,.18);animation:_lp 2s ease-in-out infinite;margin-bottom:22px;flex-shrink:0}
    .sp-name{color:#f0ead6;font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;animation:_fi .6s ease both}
    .sp-tag{color:#a09882;font-size:13px;margin:0 0 40px;letter-spacing:.02em;animation:_fi .7s .1s ease both}
    .sp-bar{position:relative;width:160px;height:3px;border-radius:99px;background:rgba(125,179,74,.14);overflow:hidden;animation:_fi .6s .2s ease both}
    .sp-bar::after{content:'';position:absolute;left:-60%;top:0;width:60%;height:100%;border-radius:99px;background:linear-gradient(90deg,transparent,#7db34a,#9dd06a,transparent);animation:_sl 1.6s ease-in-out infinite}
    .sp-dots{display:flex;gap:6px;margin-top:16px;animation:_fi .6s .3s ease both}
    .sp-dots span{width:5px;height:5px;border-radius:50%;background:rgba(125,179,74,.35)}
    .sp-dots span:nth-child(1){animation:_dp 1.4s .0s ease-in-out infinite}
    .sp-dots span:nth-child(2){animation:_dp 1.4s .2s ease-in-out infinite}
    .sp-dots span:nth-child(3){animation:_dp 1.4s .4s ease-in-out infinite}
    @keyframes _fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes _lp{0%,100%{box-shadow:0 8px 30px rgba(125,179,74,.32),inset 0 1px 0 rgba(255,255,255,.18)}50%{box-shadow:0 8px 42px rgba(125,179,74,.52),inset 0 1px 0 rgba(255,255,255,.25)}}
    @keyframes _sl{0%{left:-60%}100%{left:110%}}
    @keyframes _dp{0%,80%,100%{transform:scale(.7);background:rgba(125,179,74,.3)}40%{transform:scale(1.15);background:#7db34a}}
    @keyframes _ob{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-20px,18px) scale(1.1)}}
    @keyframes _oc{0%{transform:translate(0,0) scale(1);opacity:.7}50%{transform:translate(14px,-12px) scale(1.08);opacity:1}100%{transform:translate(-12px,8px) scale(.95);opacity:.65}}
  </style>
  <!-- SW bootstrap safety net -->
  <script src="sw-check.js" defer></script>
</head>
<body>
  <app-root>
    <div class="sp" aria-label="Loading WhereWeFishin" role="status">
      <div class="sp-logo">
        <svg width="38" height="38" viewBox="0 0 512 512" fill="none" stroke="currentColor" stroke-width="28" stroke-linejoin="round" aria-hidden="true">
          <path d="M240,152c-50.71,12.21-94.15,52.31-120.3,73.43a261.14,261.14,0,0,0-23.81-19.58C59.53,179.29,16,176,16,176s11.37,51.53,41.36,79.83C27.37,284.14,16,335.67,16,335.67s43.53-3.29,79.89-29.85a259.18,259.18,0,0,0,23.61-19.41C145.6,307.55,189.24,347.75,240,360l-16,56c39.43-6.67,78.86-35.51,94.72-48.25C448,362,496,279,496,256c0-22-48-106-176.89-111.73C303.52,131.78,263.76,102.72,224,96Z"/>
          <circle cx="416" cy="240" r="16" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <p class="sp-name">WhereWeFishin</p>
      <p class="sp-tag">Simple. Modern. Made for anglers.</p>
      <div class="sp-bar"></div>
      <div class="sp-dots"><span></span><span></span><span></span></div>
    </div>
  </app-root>
</body>
</html>
